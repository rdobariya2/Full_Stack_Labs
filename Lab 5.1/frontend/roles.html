<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixell River Roles</title>
    <link rel="stylesheet" href="styles.css"/>
    <script src="js/config.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/repositories/roleRepository.js" defer></script>
    <script src="js/roles-page.js" defer></script>
</head>
<body>

    <header role="banner">
        <img src="https://itsm-ace.ca/images/logo.svg" alt="Pixell River Financial Logo" class="logo">
        <div>
            <h1>Pixell River Roles</h1>
            <p>Job roles from the Pixell River case study.</p>
        </div>
        <nav class="main-nav">
            <a href="index.html">Employees</a>
            <a href="roles.html" class="active">Roles</a>
            <span data-auth-signed-out>
                <a href="#" data-sign-in>Log in</a>
            </span>
            <span data-auth-signed-in hidden>
                <span id="user-name"></span>
                <a href="#" data-sign-out>Log out</a>
            </span>
        </nav>
    </header>

    <main id="main-content" role="main">
        <p id="loading-message" role="status">Loading roles…</p>
        <p id="error-message" role="alert" hidden></p>

        <section class="entry-section">
            <h2>Add a role</h2>
            <form id="role-form" data-auth-signed-in hidden>
                <label>Title <input name="title" required></label>
                <label>Description <input name="description" required></label>
                <label>Category
                    <select name="category" required>
                        <option>Executive</option>
                        <option>Management</option>
                        <option>ITS &amp; Security</option>
                    </select>
                </label>
                <button type="submit">Add role</button>
                <p id="role-form-message" role="status"></p>
            </form>
            <div class="login-box" data-auth-signed-out>
                <p>Log in to add a role.</p>
                <a href="#" data-sign-in>Log in</a>
            </div>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; Copyright Pixell River Financial <span id="current-year"></span>. All rights reserved.</p>
    </footer>

</body>
</html>
